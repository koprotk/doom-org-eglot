name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs_version:
          - "29.4"
          - "30.2"
          - "snapshot"
    steps:
      - uses: actions/checkout@v4

      - uses: jcs090218/setup-emacs@master
        with:
          version: ${{ matrix.emacs_version }}

      - name: Byte-compile
        run: emacs --batch -L . -f batch-byte-compile doom-org-eglot.el

      - name: Run tests
        run: >-
          emacs --batch -L . -l doom-org-eglot-tests.el
          -f ert-run-tests-batch-and-exit
